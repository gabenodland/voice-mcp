<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice MCP</title>
  <link rel="icon" type="image/png" href="pacman.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <div class="header-left">
        <h1>Voice MCP</h1>
        <span id="status-dot" class="status-dot"></span>
        <span id="status-badge" class="badge">Idle</span>
        <span id="queue-badge" class="badge badge-dim"></span>
      </div>
      <div class="header-right">
        <button id="btn-mute" class="btn" title="Mute/Unmute (M)">🔊</button>
        <button id="btn-agents" class="btn" title="Settings">⚙️</button>
      </div>
    </header>

    <!-- Current Message -->
    <section id="now-playing" class="panel">
      <div class="now-meta">
        <span id="now-agent" class="now-agent">—</span>
        <span id="now-time" class="now-time"></span>
      </div>
      <div id="now-text" class="now-text">No message playing</div>
      <div id="controls">
        <button id="btn-play" class="btn ctrl-btn btn-play" title="Play" style="display:none">▶</button>
        <button id="btn-pause" class="btn ctrl-btn" title="Pause (Space)" style="display:none">⏸</button>
        <button id="btn-resume" class="btn ctrl-btn" title="Resume (Space)" style="display:none">▶</button>
        <button id="btn-restart" class="btn ctrl-btn" title="Restart from beginning" style="display:none">⟲</button>
      </div>
    </section>

    <!-- History -->
    <section id="history-panel" class="panel history-section">
      <div id="history-list" class="scroll-list"></div>
      <div id="history-empty" class="empty-state">No voice history yet</div>
    </section>
  </div>

  <!-- Agents Drawer (slides in from right) -->
  <div id="agents-overlay" class="drawer-overlay"></div>
  <aside id="agents-drawer" class="drawer">
    <div class="drawer-header">
      <h2>Agents</h2>
      <button id="btn-close-drawer" class="btn btn-small">✕</button>
    </div>
    <div class="device-section">
      <label class="device-label" for="device-select">Output device</label>
      <div class="device-row">
        <select id="device-select" class="agent-select"></select>
        <button id="btn-test-device" type="button" class="btn btn-small">Test</button>
      </div>
      <div id="device-reason" class="device-reason" style="display:none"></div>
    </div>
    <div id="agents-list" class="scroll-list"></div>
    <div id="agents-empty" class="empty-state">No agents registered yet</div>
    <div class="agents-actions">
      <button id="btn-purge" class="btn btn-small btn-danger" style="display:none">Purge stale agents</button>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
